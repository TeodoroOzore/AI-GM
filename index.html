<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI GM - Campaña viva</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        line-height: 1.5;
        color: #f8fafc;
        background: linear-gradient(135deg, #020617 0%, #111827 100%);
      }
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; }
      button, input, textarea, select { font: inherit; }
      .app-shell { max-width: 1500px; margin: 0 auto; padding: 1.25rem; }
      .panel { background: rgba(15, 23, 42, 0.92); border: 1px solid rgba(255,255,255,0.12); border-radius: 1rem; padding: 1rem; box-shadow: 0 16px 38px rgba(0,0,0,0.28); }
      .hero { display: grid; grid-template-columns: 1.7fr 1fr; gap: 1rem; margin-bottom: 1rem; }
      .eyebrow { text-transform: uppercase; letter-spacing: 0.3rem; color: #8b5cf6; font-size: 0.8rem; }
      .grid { display: grid; gap: 1rem; }
      .two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
      .three-col { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 1rem; }
      .form-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 0.8rem; }
      .ability-grid { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 0.6rem; }
      .tabs { display: flex; flex-wrap: wrap; gap: 0.5rem; margin: 0.5rem 0 1rem; }
      .tab-btn { background: rgba(51,65,85,0.9); color: #e2e8f0; border: 1px solid rgba(255,255,255,0.08); }
      .tab-btn.active { background: linear-gradient(90deg, #8b5cf6, #3b82f6); }
      label { display: flex; flex-direction: column; gap: 0.3rem; font-size: 0.95rem; }
      input, textarea, select { width: 100%; border-radius: 0.75rem; border: 1px solid #334155; background: #020617; color: #f8fafc; padding: 0.7rem; }
      textarea { min-height: 90px; }
      button { border: none; border-radius: 0.75rem; padding: 0.8rem 1rem; background: linear-gradient(90deg, #8b5cf6, #3b82f6); color: white; cursor: pointer; }
      button.secondary { background: linear-gradient(90deg, #334155, #4f46e5); }
      button.danger { background: linear-gradient(90deg, #b45309, #dc2626); }
      .row { display: flex; gap: 0.75rem; flex-wrap: wrap; }
      .muted { color: #cbd5e1; }
      ul { padding-left: 1.1rem; }
      .pill { display: inline-block; padding: 0.2rem 0.55rem; border-radius: 999px; background: rgba(139, 92, 246, 0.2); color: #d8b4fe; font-size: 0.82rem; margin-right: 0.4rem; }
      .stat-box { margin-bottom: 0.45rem; }
      .checkbox-list { display: grid; gap: 0.35rem; }
      .checkbox-list label { display: flex; flex-direction: row; align-items: center; gap: 0.5rem; }
      .small { font-size: 0.9rem; }
      .hint { color: #fcd34d; font-size: 0.92rem; }
      .preview-card { display: grid; gap: 0.6rem; margin-bottom: 1rem; }
      .chip-row { display: flex; flex-wrap: wrap; gap: 0.45rem; }
      .preview-list { display: grid; gap: 0.35rem; color: #e2e8f0; }
      @media (max-width: 980px) { .hero, .two-col, .three-col, .form-grid, .ability-grid { grid-template-columns: 1fr; } }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script>
      const STORAGE_KEY = 'ai-gm-state-v2';
      const abilityKeys = ['STR', 'DEX', 'CON', 'INT', 'WIS', 'CHA'];
      const skillOptions = ['Acrobacias', 'Arcana', 'Atletismo', 'Engaño', 'Historia', 'Interpretación', 'Intimidación', 'Investigación', 'Medicina', 'Naturaleza', 'Percepción', 'Persuasión', 'Religion', 'Sigilo', 'Supervivencia'];
      const raceOptions = ['human', 'elf', 'dwarf', 'halfling', 'tiefling', 'drow', 'gnome', 'half-elf', 'half-orc', 'dragonborn'];
      const classOptions = ['wizard', 'fighter', 'rogue', 'cleric', 'bard', 'druid', 'monk', 'paladin', 'ranger', 'barbarian', 'sorcerer', 'warlock'];
      const backgroundOptions = ['sage', 'soldier', 'criminal', 'outlander', 'acolyte', 'charlatan', 'guild-artisan', 'hermit', 'noble', 'folk-hero'];
      const alignmentOptions = ['lawful-good', 'neutral-good', 'chaotic-good', 'lawful-neutral', 'neutral', 'chaotic-neutral', 'lawful-evil', 'neutral-evil', 'chaotic-evil'];
      const classProfiles = {
        wizard: { hitDie: 6, saves: ['INT', 'WIS'], tabLabel: 'Grimorio', tabHint: 'Hechizos, conjuros y secretos arcanos.' },
        fighter: { hitDie: 10, saves: ['STR', 'CON'], tabLabel: 'Técnicas', tabHint: 'Estilos de combate, maniobras y reflejos marciales.' },
        rogue: { hitDie: 8, saves: ['DEX', 'INT'], tabLabel: 'Métodos', tabHint: 'Trucos, maniobras sutiles y recursos furtivos.' },
        cleric: { hitDie: 8, saves: ['WIS', 'CHA'], tabLabel: 'Ritos', tabHint: 'Devociones, bendiciones y rituales sagrados.' },
        bard: { hitDie: 8, saves: ['DEX', 'CHA'], tabLabel: 'Canciones', tabHint: 'Inspiración, arte y hechizos de la palabra.' },
        druid: { hitDie: 8, saves: ['INT', 'WIS'], tabLabel: 'Círculos', tabHint: 'Ritos, magia salvaje y vínculos con la naturaleza.' },
        monk: { hitDie: 8, saves: ['STR', 'DEX'], tabLabel: 'Flores de combate', tabHint: 'Técnicas, artes marciales y disciplina.' },
        paladin: { hitDie: 10, saves: ['WIS', 'CHA'], tabLabel: 'Juramentos', tabHint: 'Votos, bendiciones y sanciones.' },
        ranger: { hitDie: 10, saves: ['STR', 'DEX'], tabLabel: 'Vigilancias', tabHint: 'Tácticas de caza, rastreo y supervivencia.' },
        barbarian: { hitDie: 12, saves: ['STR', 'CON'], tabLabel: 'Furias', tabHint: 'Ráfagas, formas agresivas y resistencia.' },
        sorcerer: { hitDie: 6, saves: ['CON', 'CHA'], tabLabel: 'Linaje', tabHint: 'Sangre, magia innata y potencial.' },
        warlock: { hitDie: 8, saves: ['WIS', 'CHA'], tabLabel: 'Pactos', tabHint: 'Vínculos con un patron y secretos concedidos.' }
      };

      const initialDraft = {
        name: 'Aelrin',
        race: 'elf',
        className: 'wizard',
        subclass: 'Evocador',
        background: 'sage',
        alignment: 'neutral-good',
        level: '3',
        experience: '6500',
        proficiencyBonus: '2',
        armorClass: '13',
        speed: '30',
        inspiration: true,
        abilities: { STR: '8', DEX: '14', CON: '12', INT: '16', WIS: '13', CHA: '10' },
        abilityMethod: 'standard-array',
        skillProficiencies: ['Arcana', 'Historia'],
        inventory: 'Libro de runas\nPiedra luminosa',
        equipment: 'Daga de práctica\nCapa antigua',
        spells: 'Mago armado\nDetectar magia',
        cantrips: 'Llamarada\nMano de mago',
        features: 'Visión en la penumbra\nInstinto de erudito',
        traits: 'Curioso\nPaciente',
        languages: 'Común\nElfico\nDracónico',
        proficiencies: 'Herramientas de alquimia\nIdiomas',
        attackFormulas: 'Daga: 1d4+2',
        conditions: 'Ninguno',
        notes: 'Llegó a la costa tras un suceso extraño.',
        companions: 'Ninguno',
        familiars: 'Ninguno',
        feats: 'Sensible a la magia',
        subclassFeatures: 'Manipulación elemental',
        backgroundFeatures: 'Investigador de lo oculto'
      };

      const state = {
        draft: { ...initialDraft },
        character: null,
        campaign: null,
        actionInput: '',
        isLoaded: false,
        view: 'create',
        activeTab: 'statistics',
        abilityScoresLocked: false,
        skillProficienciesLocked: false
      };

      function parseList(value) {
        return String(value || '').split('\n').map((entry) => entry.trim()).filter(Boolean);
      }

      function parseAttackFormulas(input) {
        return parseList(input).map((line) => {
          const [name, ...rest] = line.split(':');
          return { name: name?.trim() || 'Ataque', formula: rest.join(':').trim() || '1d4+2', notes: '' };
        });
      }

      function getAbilityMethodPreset(method) {
        if (method === 'point-buy') {
          return { STR: '8', DEX: '8', CON: '8', INT: '8', WIS: '8', CHA: '8' };
        }
        if (method === 'dice-roll') {
          return { STR: '15', DEX: '14', CON: '13', INT: '12', WIS: '10', CHA: '8' };
        }
        return { STR: '15', DEX: '14', CON: '13', INT: '12', WIS: '10', CHA: '8' };
      }

      function applyAbilityPreset(method) {
        const values = getAbilityMethodPreset(method);
        state.draft.abilities = { ...values };
        state.draft.abilityMethod = method;
      }

      function getAbilityModifier(score) {
        return Math.floor((Number(score) - 10) / 2);
      }

      function getClassDisplayName(value) {
        const normalized = String(value || '').trim().toLowerCase();
        const map = {
          wizard: 'Mago', fighter: 'Guerrero', rogue: 'Pícaro', cleric: 'Clérigo', bard: 'Bardo', druid: 'Druida', monk: 'Monje', paladin: 'Paladín', ranger: 'Explorador', barbarian: 'Bárbaro', sorcerer: 'Hechicero', warlock: 'Brujo', mago: 'Mago', guerrero: 'Guerrero', pícaro: 'Pícaro', clérigo: 'Clérigo', bardo: 'Bardo', druida: 'Druida', monje: 'Monje', paladín: 'Paladín', explorador: 'Explorador', bárbaro: 'Bárbaro', hechicero: 'Hechicero', brujo: 'Brujo'
        };
        return map[normalized] || String(value || '').trim() || 'Clase';
      }

      function getRaceDisplayName(value) {
        const normalized = String(value || '').trim().toLowerCase();
        const map = { human: 'Humano', elf: 'Elfo', dwarf: 'Enano', halfling: 'Mediano', tiefling: 'Tiefling', drow: 'Drow', gnome: 'Gnomo', 'half-elf': 'Semielfo', 'half-orc': 'Semiorco', dragonborn: 'Dracónido' };
        return map[normalized] || String(value || '').trim() || 'Raza';
      }

      function getBackgroundDisplayName(value) {
        const normalized = String(value || '').trim().toLowerCase();
        const map = { sage: 'Erudito', soldier: 'Soldado', criminal: 'Criminal', outlander: 'Forastero', acolyte: 'Acólito', charlatan: 'Charlatán', 'guild-artisan': 'Artífice de gremio', hermit: 'Ermitaño', noble: 'Noble', 'folk-hero': 'Héroe del pueblo' };
        return map[normalized] || String(value || '').trim() || 'Trasfondo';
      }

      function getAlignmentDisplayName(value) {
        const normalized = String(value || '').trim().toLowerCase();
        const map = { 'lawful-good': 'Legal Bueno', 'neutral-good': 'Neutral Bueno', 'chaotic-good': 'Caótico Bueno', 'lawful-neutral': 'Legal Neutral', neutral: 'Neutral', 'chaotic-neutral': 'Caótico Neutral', 'lawful-evil': 'Legal Malvado', 'neutral-evil': 'Neutral Malvado', 'chaotic-evil': 'Caótico Malvado' };
        return map[normalized] || String(value || '').trim() || 'Alineación';
      }

      function getClassProfile(className) {
        const normalized = String(className || '').trim().toLowerCase();
        return classProfiles[normalized] || classProfiles.wizard;
      }

      function calculateDerivedStats(draft) {
        const classProfile = getClassProfile(draft.className);
        const abilities = {};
        abilityKeys.forEach((key) => {
          abilities[key] = Number(draft.abilities[key]) || 10;
        });
        const modifiers = {};
        abilityKeys.forEach((key) => {
          modifiers[key] = getAbilityModifier(abilities[key]);
        });
        const conMod = modifiers.CON;
        const hitDie = classProfile.hitDie;
        const hpBase = hitDie + conMod;
        const level = Number(draft.level) || 1;
        const hp = hpBase + Math.max(0, level - 1) * (Math.floor(hitDie / 2) + 1 + conMod);
        const savingThrows = Object.fromEntries(abilityKeys.map((key) => {
          const proficient = classProfile.saves.includes(key);
          const value = modifiers[key] + (proficient ? Number(draft.proficiencyBonus) || 2 : 0);
          return [key, { modifier: modifiers[key], proficient, value, formula: `${modifiers[key] >= 0 ? '+' + modifiers[key] : modifiers[key]}${proficient ? ' + bono' : ''}` }];
        }));
        const passivePerception = 10 + modifiers.WIS + (draft.skillProficiencies.includes('Percepción') ? Number(draft.proficiencyBonus) || 2 : 0);
        return {
          abilities,
          modifiers,
          hp,
          maxHp: hp,
          hitDie,
          armorClass: Number(draft.armorClass) || 10,
          speed: Number(draft.speed) || 30,
          initiative: modifiers.DEX,
          passivePerception,
          savingThrows,
          hpFormula: `${hitDie}d${hitDie} + CON` ,
          proficiencyBonus: Number(draft.proficiencyBonus) || 2,
          spellTabLabel: classProfile.tabLabel,
          spellTabHint: classProfile.tabHint
        };
      }

      function createCharacterFromDraft(draft) {
        const derived = calculateDerivedStats(draft);
        return {
          name: draft.name.trim() || 'Jugador',
          race: getRaceDisplayName(draft.race),
          className: getClassDisplayName(draft.className),
          subclass: draft.subclass.trim() || 'Sin subtipo',
          background: getBackgroundDisplayName(draft.background),
          alignment: getAlignmentDisplayName(draft.alignment),
          level: Number(draft.level) || 1,
          experience: Number(draft.experience) || 0,
          proficiencyBonus: Number(draft.proficiencyBonus) || 2,
          hp: derived.hp,
          maxHp: derived.hp,
          tempHp: 0,
          armorClass: Number(draft.armorClass) || 10,
          speed: Number(draft.speed) || 30,
          initiative: derived.initiative,
          passivePerception: derived.passivePerception,
          inspiration: Boolean(draft.inspiration),
          abilities: derived.abilities,
          modifiers: derived.modifiers,
          savingThrows: derived.savingThrows,
          skills: draft.skillProficiencies || [],
          inventory: parseList(draft.inventory),
          equipment: parseList(draft.equipment),
          spells: parseList(draft.spells),
          cantrips: parseList(draft.cantrips),
          features: parseList(draft.features),
          traits: parseList(draft.traits),
          languages: parseList(draft.languages),
          proficiencies: parseList(draft.proficiencies),
          attackFormulas: parseAttackFormulas(draft.attackFormulas),
          conditions: parseList(draft.conditions),
          notes: parseList(draft.notes),
          companions: parseList(draft.companions),
          familiars: parseList(draft.familiars),
          feats: parseList(draft.feats),
          subclassFeatures: parseList(draft.subclassFeatures),
          backgroundFeatures: parseList(draft.backgroundFeatures),
          derivedRules: {
            hpFormula: derived.hpFormula,
            spellTabLabel: derived.spellTabLabel,
            spellTabHint: derived.spellTabHint,
            savingThrows: derived.savingThrows
          },
          abilityMethod: draft.abilityMethod || 'standard-array'
        };
      }

      function hashString(value) {
        let hash = 0;
        for (let index = 0; index < value.length; index += 1) {
          hash = (hash << 5) - hash + value.charCodeAt(index);
          hash |= 0;
        }
        return Math.abs(hash);
      }

      function createCampaign(character) {
        const motifs = ['Círculo de Luz Negra', 'Reino de la Costa Quemada', 'Laberinto de los Faros', 'Nexo de Ciudades Perdidas', 'Senda de Vientos Rotos'];
        const index = hashString(`${character.name}${character.className}${Date.now()}`) % motifs.length;
        const title = `${character.name} y ${motifs[index]}`;
        return {
          id: String(Date.now()),
          title,
          world: 'Un mundo de reinos en conflicto donde las ruinas antiguas despiertan cuando la voluntad del protagonista cambia el curso del destino.',
          summary: `La campaña se abre para ${character.name}, un ${character.race.toLowerCase()} ${character.className.toLowerCase()} que debe decidir el futuro de una región marcada por secretos y leyendas.`,
          lore: [
            'Cada faro encendido modifica la geografía invisible de la región.',
            'Los pactos entre linajes y fuerzas elementales aún vibran en los lugares más oscuros.',
            'La memoria del mundo se conserva en objetos pequeños que parecen insignificantes.'
          ],
          history: [`Inicio de campaña para ${character.name}.`, 'El DM ha generado una nueva ruta narrativa basada en la ficha del personaje.'],
          location: 'Puerto de Nareth',
          lastAction: 'El personaje aún no ha tomado una decisión.',
          mood: 'misterio y ambición'
        };
      }

      function saveState() {
        if (!state.character || !state.campaign) return;
        localStorage.setItem(STORAGE_KEY, JSON.stringify({ character: state.character, campaign: state.campaign, metadata: { abilityScoresLocked: state.abilityScoresLocked, skillProficienciesLocked: state.skillProficienciesLocked } }));
      }

      function loadState() {
        try {
          const stored = localStorage.getItem(STORAGE_KEY);
          if (stored) {
            const parsed = JSON.parse(stored);
            state.character = parsed.character || null;
            state.campaign = parsed.campaign || null;
            state.abilityScoresLocked = Boolean(parsed.metadata?.abilityScoresLocked);
            state.skillProficienciesLocked = Boolean(parsed.metadata?.skillProficienciesLocked);
            state.view = state.character && state.campaign ? 'campaign' : 'create';
          }
        } catch (error) {
          console.warn('No se pudo cargar el estado', error);
        }
        state.isLoaded = true;
        render();
      }

      function startCampaign(event) {
        event.preventDefault();
        const nextCharacter = createCharacterFromDraft(state.draft);
        const nextCampaign = createCampaign(nextCharacter);
        state.character = nextCharacter;
        state.campaign = nextCampaign;
        state.view = 'campaign';
        state.actionInput = '';
        state.abilityScoresLocked = true;
        state.skillProficienciesLocked = true;
        saveState();
        render();
      }

      function startNewCampaign() {
        if (!state.character) return;
        const nextCampaign = createCampaign(state.character);
        state.campaign = nextCampaign;
        state.actionInput = '';
        saveState();
        render();
      }

      function advanceStory() {
        if (!state.character || !state.campaign || !state.actionInput.trim()) return;
        const action = state.actionInput.trim();
        const dmReply = generateDMReply(state.campaign, state.character, action);
        const updatedCharacter = { ...state.character };
        updatedCharacter.notes = [`${new Date().toLocaleDateString()}: ${dmReply}`, ...updatedCharacter.notes.slice(0, 4)];
        updatedCharacter.conditions = updatedCharacter.conditions.includes('En combate') ? updatedCharacter.conditions : ['En combate', ...updatedCharacter.conditions.filter((entry) => entry !== 'En combate')];
        if (action.toLowerCase().includes('ataco') || action.toLowerCase().includes('combato')) {
          updatedCharacter.hp = Math.max(0, updatedCharacter.hp - 2);
        }
        state.character = updatedCharacter;
        const nextCampaign = {
          ...state.campaign,
          history: [`DM: ${dmReply}`, `Jugador: ${action}`, ...state.campaign.history.slice(0, 4)],
          lastAction: action,
          lore: [`Tras la acción de ${state.character.name}, ${state.campaign.location} adquirió un nuevo secreto.`, ...state.campaign.lore.slice(0, 2)]
        };
        state.campaign = nextCampaign;
        state.actionInput = '';
        saveState();
        render();
      }

      function updateByDM() {
        if (!state.character || !state.campaign) return;
        const nextCharacter = { ...state.character };
        nextCharacter.notes = [`${new Date().toLocaleDateString()}: el DM ha actualizado la ficha con nuevas consecuencias de campaña.`, ...nextCharacter.notes.slice(0, 4)];
        nextCharacter.conditions = nextCharacter.conditions.includes('Sintonizado') ? nextCharacter.conditions : ['Sintonizado', ...nextCharacter.conditions];
        state.character = nextCharacter;
        state.campaign = { ...state.campaign, history: [`DM: la campaña ha evolucionado y la ficha se ha actualizado.`, ...state.campaign.history.slice(0, 4)] };
        saveState();
        render();
      }

      function toggleAbilityLock() {
        if (!state.character) return;
        const shouldUnlock = window.confirm('¿Deseas desbloquear las estadísticas por avance de nivel o situación extraordinaria?');
        if (shouldUnlock) {
          state.abilityScoresLocked = false;
          saveState();
          render();
        }
      }

      function toggleSkillLock() {
        if (!state.character) return;
        const shouldUnlock = window.confirm('¿Deseas desbloquear las competencias y habilidades para ajustarlas?');
        if (shouldUnlock) {
          state.skillProficienciesLocked = false;
          saveState();
          render();
        }
      }

      function generateDMReply(campaign, character, action) {
        const normalized = String(action || '').toLowerCase();
        if (normalized.includes('ataco') || normalized.includes('combato')) {
          return `${character.name} entra en tensión y la región responde con un conflicto que cambia el tono del lugar.`;
        }
        if (normalized.includes('investigo') || normalized.includes('busco')) {
          return `El pasado de ${campaign.location} se abre y revela un detalle que solo ${character.name} puede entender.`;
        }
        if (normalized.includes('hablo') || normalized.includes('negocio')) {
          return `Un personaje importante escucha a ${character.name} y el encuentro deja una herencia política.`;
        }
        return `El DM interpreta la acción de ${character.name} como un giro que transforma ${campaign.location} y deja una huella duradera.`;
      }

      function bindEvents() {
        document.addEventListener('input', (event) => {
          const target = event.target;
          if (!target.dataset.field) return;
          const field = target.dataset.field;
          if (field === 'draft.name') state.draft.name = target.value;
          else if (field === 'draft.race') state.draft.race = target.value;
          else if (field === 'draft.className') state.draft.className = target.value;
          else if (field === 'draft.subclass') state.draft.subclass = target.value;
          else if (field === 'draft.background') state.draft.background = target.value;
          else if (field === 'draft.alignment') state.draft.alignment = target.value;
          else if (field === 'draft.level') state.draft.level = target.value;
          else if (field === 'draft.experience') state.draft.experience = target.value;
          else if (field === 'draft.proficiencyBonus') state.draft.proficiencyBonus = target.value;
          else if (field === 'draft.armorClass') state.draft.armorClass = target.value;
          else if (field === 'draft.speed') state.draft.speed = target.value;
          else if (field === 'draft.inventory') state.draft.inventory = target.value;
          else if (field === 'draft.equipment') state.draft.equipment = target.value;
          else if (field === 'draft.spells') state.draft.spells = target.value;
          else if (field === 'draft.cantrips') state.draft.cantrips = target.value;
          else if (field === 'draft.features') state.draft.features = target.value;
          else if (field === 'draft.traits') state.draft.traits = target.value;
          else if (field === 'draft.languages') state.draft.languages = target.value;
          else if (field === 'draft.proficiencies') state.draft.proficiencies = target.value;
          else if (field === 'draft.attackFormulas') state.draft.attackFormulas = target.value;
          else if (field === 'draft.conditions') state.draft.conditions = target.value;
          else if (field === 'draft.notes') state.draft.notes = target.value;
          else if (field === 'draft.companions') state.draft.companions = target.value;
          else if (field === 'draft.familiars') state.draft.familiars = target.value;
          else if (field === 'draft.feats') state.draft.feats = target.value;
          else if (field === 'draft.subclassFeatures') state.draft.subclassFeatures = target.value;
          else if (field === 'draft.backgroundFeatures') state.draft.backgroundFeatures = target.value;
          else if (field === 'draft.abilityMethod') state.draft.abilityMethod = target.value;
          else if (field === 'draft.abilities') state.draft.abilities[target.name] = target.value;
        });

        document.addEventListener('change', (event) => {
          const target = event.target;
          if (!target.dataset.field) return;
          const field = target.dataset.field;
          if (field === 'draft.inspiration') {
            state.draft.inspiration = target.checked;
          } else if (field === 'draft.skill') {
            const value = target.value;
            const set = new Set(state.draft.skillProficiencies || []);
            if (target.checked) set.add(value); else set.delete(value);
            state.draft.skillProficiencies = Array.from(set);
          } else if (field === 'draft.abilityMethod') {
            applyAbilityPreset(target.value);
          } else if (field === 'draft.name') {
            state.draft.name = target.value;
          } else if (field === 'draft.race') {
            state.draft.race = target.value;
          } else if (field === 'draft.className') {
            state.draft.className = target.value;
          } else if (field === 'draft.subclass') {
            state.draft.subclass = target.value;
          } else if (field === 'draft.background') {
            state.draft.background = target.value;
          } else if (field === 'draft.alignment') {
            state.draft.alignment = target.value;
          } else if (field === 'draft.level') {
            state.draft.level = target.value;
          } else if (field === 'draft.experience') {
            state.draft.experience = target.value;
          } else if (field === 'draft.proficiencyBonus') {
            state.draft.proficiencyBonus = target.value;
          } else if (field === 'draft.armorClass') {
            state.draft.armorClass = target.value;
          } else if (field === 'draft.speed') {
            state.draft.speed = target.value;
          } else if (field === 'draft.inventory') {
            state.draft.inventory = target.value;
          } else if (field === 'draft.equipment') {
            state.draft.equipment = target.value;
          } else if (field === 'draft.spells') {
            state.draft.spells = target.value;
          } else if (field === 'draft.cantrips') {
            state.draft.cantrips = target.value;
          } else if (field === 'draft.features') {
            state.draft.features = target.value;
          } else if (field === 'draft.traits') {
            state.draft.traits = target.value;
          } else if (field === 'draft.languages') {
            state.draft.languages = target.value;
          } else if (field === 'draft.proficiencies') {
            state.draft.proficiencies = target.value;
          } else if (field === 'draft.attackFormulas') {
            state.draft.attackFormulas = target.value;
          } else if (field === 'draft.conditions') {
            state.draft.conditions = target.value;
          } else if (field === 'draft.notes') {
            state.draft.notes = target.value;
          } else if (field === 'draft.companions') {
            state.draft.companions = target.value;
          } else if (field === 'draft.familiars') {
            state.draft.familiars = target.value;
          } else if (field === 'draft.feats') {
            state.draft.feats = target.value;
          } else if (field === 'draft.subclassFeatures') {
            state.draft.subclassFeatures = target.value;
          } else if (field === 'draft.backgroundFeatures') {
            state.draft.backgroundFeatures = target.value;
          } else if (field === 'draft.abilities') {
            state.draft.abilities[target.name] = target.value;
          }
        });

        document.addEventListener('click', (event) => {
          const target = event.target;
          if (target.id === 'start-campaign') {
            startCampaign(event);
          } else if (target.id === 'advance-story') {
            advanceStory();
          } else if (target.id === 'new-campaign') {
            startNewCampaign();
          } else if (target.id === 'dm-update') {
            updateByDM();
          } else if (target.id === 'reset-form') {
            state.draft = { ...initialDraft };
            state.actionInput = '';
            render();
          } else if (target.id === 'unlock-stats') {
            toggleAbilityLock();
          } else if (target.id === 'unlock-skills') {
            toggleSkillLock();
          } else if (target.id === 'roll-abilities') {
            applyAbilityPreset('dice-roll');
            const rolls = Object.fromEntries(abilityKeys.map((ability) => [ability, String(rollAbility())]));
            state.draft.abilities = rolls;
            render();
          } else if (target.dataset.tab) {
            state.activeTab = target.dataset.tab;
            render();
          }
        });

        document.addEventListener('keydown', (event) => {
          if (event.key === 'Enter' && event.target.id === 'action-input' && (event.metaKey || event.ctrlKey)) {
            advanceStory();
          }
        });
      }

      function rollAbility() {
        const rolls = Array.from({ length: 4 }, () => Math.floor(Math.random() * 6) + 1).sort((a, b) => a - b);
        rolls.shift();
        return rolls.reduce((sum, value) => sum + value, 0);
      }

      function getSkillOptionsForClass(className) {
        const normalized = String(className || '').trim().toLowerCase();
        if (normalized.includes('wizard') || normalized.includes('sorcerer') || normalized.includes('warlock')) {
          return skillOptions.filter((skill) => ['Arcana', 'Historia', 'Investigación', 'Religión', 'Persuasión', 'Intimidación'].includes(skill));
        }
        if (normalized.includes('fighter') || normalized.includes('barbarian') || normalized.includes('paladin') || normalized.includes('ranger')) {
          return skillOptions.filter((skill) => ['Atletismo', 'Intimidación', 'Percepción', 'Supervivencia', 'Historia', 'Persuasión'].includes(skill));
        }
        if (normalized.includes('rogue')) {
          return skillOptions.filter((skill) => ['Acrobacias', 'Engaño', 'Investigación', 'Sigilo', 'Percepción', 'Interpretación'].includes(skill));
        }
        return skillOptions;
      }

      function renderCreateView() {
        const skillChoices = getSkillOptionsForClass(state.draft.className);
        const pointBuyUsed = abilityKeys.reduce((sum, key) => sum + costForAbilityScore(Number(state.draft.abilities[key]) || 8), 0);
        const pointBuyRemaining = 27 - pointBuyUsed;
        const previewStats = calculateDerivedStats(state.draft);
        return `
          <div class="app-shell">
            <header class="hero">
              <div class="panel">
                <p class="eyebrow">AI GM • creación legendaria</p>
                <h1>Forja un héroe para una campaña viva</h1>
                <p class="muted">Cada decisión deja una huella en el relato. Atributos, habilidades, equipo y hechizos se vuelven parte del mundo y del DM.</p>
              </div>
              <div class="panel">
                <h3>Creación de estadísticas</h3>
                <label>Metodo de creación<select data-field="draft.abilityMethod">
                  <option value="standard-array" ${state.draft.abilityMethod === 'standard-array' ? 'selected' : ''}>Standard Array</option>
                  <option value="point-buy" ${state.draft.abilityMethod === 'point-buy' ? 'selected' : ''}>Point Buy</option>
                  <option value="dice-roll" ${state.draft.abilityMethod === 'dice-roll' ? 'selected' : ''}>Tirada de dados</option>
                </select></label>
                <div class="small">${state.draft.abilityMethod === 'point-buy' ? `Puntos disponibles: ${pointBuyRemaining}` : 'Las estadísticas se fijan tras la confirmación inicial.'}</div>
                ${state.draft.abilityMethod === 'dice-roll' ? '<button id="roll-abilities" type="button" class="secondary">Tirar atributos</button>' : ''}
              </div>
            </header>
            <div class="panel preview-card">
              <div class="chip-row">
                <span class="pill">${getClassDisplayName(state.draft.className)}</span>
                <span class="pill">${getRaceDisplayName(state.draft.race)}</span>
                <span class="pill">${getBackgroundDisplayName(state.draft.background)}</span>
                <span class="pill">${getAlignmentDisplayName(state.draft.alignment)}</span>
              </div>
              <div class="preview-list">
                <div><strong>Resumen:</strong> ${state.draft.name} • Nivel ${state.draft.level} • HP ${previewStats.hp} • CA ${previewStats.armorClass}</div>
                <div><strong>Salvaciones:</strong> ${abilityKeys.map((ability) => `${ability} ${previewStats.savingThrows[ability].value >= 0 ? '+' : ''}${previewStats.savingThrows[ability].value}`).join(' • ')}</div>
                <div><strong>Inspiración:</strong> ${state.draft.inspiration ? 'Activada' : 'No activa'} • <strong>Competencia:</strong> +${state.draft.proficiencyBonus}</div>
              </div>
            </div>
            <form class="panel grid" onsubmit="event.preventDefault(); startCampaign(event);">
              <div class="form-grid">
                <label>Nombre<input data-field="draft.name" value="${state.draft.name}" /></label>
                <label>Raza<select data-field="draft.race">${raceOptions.map((option) => `<option value="${option}" ${state.draft.race === option ? 'selected' : ''}>${getRaceDisplayName(option)}</option>`).join('')}</select></label>
                <label>Clase<select data-field="draft.className">${classOptions.map((option) => `<option value="${option}" ${state.draft.className === option ? 'selected' : ''}>${getClassDisplayName(option)}</option>`).join('')}</select></label>
                <label>Subclase<input data-field="draft.subclass" value="${state.draft.subclass}" /></label>
                <label>Trasfondo<select data-field="draft.background">${backgroundOptions.map((option) => `<option value="${option}" ${state.draft.background === option ? 'selected' : ''}>${getBackgroundDisplayName(option)}</option>`).join('')}</select></label>
                <label>Alineación<select data-field="draft.alignment">${alignmentOptions.map((option) => `<option value="${option}" ${state.draft.alignment === option ? 'selected' : ''}>${getAlignmentDisplayName(option)}</option>`).join('')}</select></label>
                <label>Nivel<input data-field="draft.level" type="number" value="${state.draft.level}" /></label>
                <label>Experiencia<input data-field="draft.experience" type="number" value="${state.draft.experience}" /></label>
                <label>Bono de competencia<input data-field="draft.proficiencyBonus" type="number" value="${state.draft.proficiencyBonus}" /></label>
                <label>CA<input data-field="draft.armorClass" type="number" value="${state.draft.armorClass}" /></label>
                <label>Velocidad<input data-field="draft.speed" type="number" value="${state.draft.speed}" /></label>
                <label><span>Inspiración</span><input type="checkbox" data-field="draft.inspiration" ${state.draft.inspiration ? 'checked' : ''} /></label>
              </div>
              <div class="ability-grid">
                ${abilityKeys.map((ability) => `<label>${ability}<input data-field="draft.abilities" name="${ability}" type="number" value="${state.draft.abilities[ability]}" /></label>`).join('')}
              </div>
              <div class="panel">
                <h3>Competencias y habilidades</h3>
                <div class="checkbox-list">
                  ${skillChoices.map((skill) => `<label><input type="checkbox" data-field="draft.skill" value="${skill}" ${state.draft.skillProficiencies.includes(skill) ? 'checked' : ''} /> ${skill}</label>`).join('')}
                </div>
              </div>
              <div class="three-col">
                <label>Inventario<textarea data-field="draft.inventory">${state.draft.inventory}</textarea></label>
                <label>Equipo<textarea data-field="draft.equipment">${state.draft.equipment}</textarea></label>
                <label>Hechizos<textarea data-field="draft.spells">${state.draft.spells}</textarea></label>
                <label>Trucos<textarea data-field="draft.cantrips">${state.draft.cantrips}</textarea></label>
                <label>Rasgos y talentos<textarea data-field="draft.features">${state.draft.features}</textarea></label>
                <label>Rasgos raciales<textarea data-field="draft.traits">${state.draft.traits}</textarea></label>
                <label>Idiomas y competencias<textarea data-field="draft.proficiencies">${state.draft.proficiencies}</textarea></label>
                <label>Fórmulas de ataque<textarea data-field="draft.attackFormulas">${state.draft.attackFormulas}</textarea></label>
                <label>Condiciones<textarea data-field="draft.conditions">${state.draft.conditions}</textarea></label>
                <label>Notas<textarea data-field="draft.notes">${state.draft.notes}</textarea></label>
                <label>Compañeros<textarea data-field="draft.companions">${state.draft.companions}</textarea></label>
                <label>Familiares<textarea data-field="draft.familiars">${state.draft.familiars}</textarea></label>
                <label>Dotes<textarea data-field="draft.feats">${state.draft.feats}</textarea></label>
                <label>Subclase<textarea data-field="draft.subclassFeatures">${state.draft.subclassFeatures}</textarea></label>
                <label>Características de trasfondo<textarea data-field="draft.backgroundFeatures">${state.draft.backgroundFeatures}</textarea></label>
              </div>
              <div class="row">
                <button id="start-campaign" type="button">Crear personaje y abrir campaña</button>
                <button class="secondary" id="reset-form" type="button">Restablecer plantilla</button>
              </div>
            </form>
          </div>
        `;
      }

      function costForAbilityScore(value) {
        const score = Number(value) || 8;
        if (score <= 8) return 0;
        if (score === 9) return 1;
        if (score === 10) return 2;
        if (score === 11) return 3;
        if (score === 12) return 4;
        if (score === 13) return 5;
        if (score === 14) return 7;
        if (score === 15) return 9;
        return 999;
      }

      function renderSheetContent(character, campaign) {
        const tabs = [
          { key: 'statistics', label: 'Estadísticas' },
          { key: 'status', label: 'Estado' },
          { key: 'inventory', label: 'Inventario' },
          { key: 'spells', label: character.derivedRules?.spellTabLabel || 'Recursos' },
          { key: 'skills', label: 'Habilidades y competencias' },
          { key: 'subclasses', label: 'Subclases' },
          { key: 'equipment', label: 'Equipo' },
          { key: 'feats', label: 'Dotes' },
          { key: 'companions', label: 'Compañeros' },
          { key: 'familiars', label: 'Familiares' }
        ];
        const active = state.activeTab || 'statistics';
        return `
          <div class="tabs">
            ${tabs.map((tab) => `<button type="button" class="tab-btn ${active === tab.key ? 'active' : ''}" data-tab="${tab.key}">${tab.label}</button>`).join('')}
          </div>
          ${renderTabContent(active, character, campaign)}
        `;
      }

      function renderTabContent(active, character, campaign) {
        if (active === 'status') {
          return `
            <div class="three-col">
              <div class="panel"><h3>Combate y estado</h3><div class="stat-box"><strong>Vida:</strong> ${character.hp}/${character.maxHp}</div><div class="stat-box"><strong>Temp HP:</strong> ${character.tempHp}</div><div class="stat-box"><strong>CA:</strong> ${character.armorClass}</div><div class="stat-box"><strong>Velocidad:</strong> ${character.speed}</div><div class="stat-box"><strong>Iniciativa:</strong> ${character.initiative}</div><div class="stat-box"><strong>Percepción pasiva:</strong> ${character.passivePerception}</div><div class="stat-box"><strong>Inspiración:</strong> ${character.inspiration ? 'Sí' : 'No'}</div><div class="stat-box"><strong>Condiciones:</strong> ${character.conditions.join(', ') || 'Ninguna'}</div></div>
              <div class="panel"><h3>Salvaciones</h3>${abilityKeys.map((ability) => `<div class="stat-box"><strong>${ability}:</strong> ${character.savingThrows[ability].value} (${character.savingThrows[ability].formula})</div>`).join('')}</div>
              <div class="panel"><h3>Mecánicas derivadas</h3><div class="stat-box"><strong>Fórmula de HP:</strong> ${character.derivedRules.hpFormula}</div><div class="stat-box"><strong>Bono:</strong> +${character.proficiencyBonus}</div><div class="stat-box"><strong>Regla de solapa:</strong> ${character.derivedRules.spellTabHint}</div></div>
            </div>
          `;
        }
        if (active === 'inventory') {
          return `
            <div class="two-col">
              <div class="panel"><h3>Inventario</h3><ul>${character.inventory.map((item) => `<li>${item}</li>`).join('')}</ul></div>
              <div class="panel"><h3>Equipo</h3><ul>${character.equipment.map((item) => `<li>${item}</li>`).join('')}</ul></div>
            </div>
          `;
        }
        if (active === 'spells') {
          return `
            <div class="two-col">
              <div class="panel"><h3>${character.derivedRules.spellTabLabel}</h3><p class="muted">${character.derivedRules.spellTabHint}</p><ul>${character.spells.map((entry) => `<li>${entry}</li>`).join('')}</ul></div>
              <div class="panel"><h3>Trucos</h3><ul>${character.cantrips.map((entry) => `<li>${entry}</li>`).join('')}</ul></div>
            </div>
          `;
        }
        if (active === 'skills') {
          return `
            <div class="two-col">
              <div class="panel"><h3>Habilidades y competencias</h3><div class="checkbox-list">${character.skills.map((skill) => `<label><input type="checkbox" checked disabled /> ${skill}</label>`).join('')}</div></div>
              <div class="panel"><h3>Competencias</h3><ul>${character.proficiencies.map((entry) => `<li>${entry}</li>`).join('')}</ul></div>
            </div>
          `;
        }
        if (active === 'subclasses') {
          return `
            <div class="two-col">
              <div class="panel"><h3>Subclase</h3><p>${character.subclass}</p><ul>${character.subclassFeatures.map((entry) => `<li>${entry}</li>`).join('')}</ul></div>
              <div class="panel"><h3>Trasfondo</h3><p>${character.background}</p><ul>${character.backgroundFeatures.map((entry) => `<li>${entry}</li>`).join('')}</ul></div>
            </div>
          `;
        }
        if (active === 'equipment') {
          return `
            <div class="panel"><h3>Equipo y recursos</h3><ul>${character.equipment.map((entry) => `<li>${entry}</li>`).join('')}</ul></div>
          `;
        }
        if (active === 'feats') {
          return `
            <div class="panel"><h3>Dotes</h3><ul>${character.feats.map((entry) => `<li>${entry}</li>`).join('')}</ul></div>
          `;
        }
        if (active === 'companions') {
          return `
            <div class="panel"><h3>Compañeros</h3><ul>${character.companions.map((entry) => `<li>${entry}</li>`).join('')}</ul></div>
          `;
        }
        if (active === 'familiars') {
          return `
            <div class="panel"><h3>Familiares</h3><ul>${character.familiars.map((entry) => `<li>${entry}</li>`).join('')}</ul></div>
          `;
        }
        return `
          <div class="three-col">
            <div class="panel"><h3>Datos básicos</h3><div class="stat-box"><strong>Nombre:</strong> ${character.name}</div><div class="stat-box"><strong>Raza:</strong> ${character.race}</div><div class="stat-box"><strong>Clase:</strong> ${character.className}</div><div class="stat-box"><strong>Subclase:</strong> ${character.subclass}</div><div class="stat-box"><strong>Trasfondo:</strong> ${character.background}</div><div class="stat-box"><strong>Alineación:</strong> ${character.alignment}</div><div class="stat-box"><strong>Nivel:</strong> ${character.level}</div><div class="stat-box"><strong>Experiencia:</strong> ${character.experience}</div></div>
            <div class="panel"><h3>Atributos</h3>${abilityKeys.map((ability) => `<div class="stat-box"><strong>${ability}:</strong> ${character.abilities[ability]} (${character.modifiers[ability] >= 0 ? '+' : ''}${character.modifiers[ability]})</div>`).join('')}<div class="stat-box"><strong>CA:</strong> ${character.armorClass}</div><div class="stat-box"><strong>Iniciativa:</strong> ${character.initiative}</div><div class="stat-box"><strong>Percepción pasiva:</strong> ${character.passivePerception}</div></div>
            <div class="panel"><h3>Rasgos y combate</h3><div class="stat-box"><strong>Rasgos:</strong> ${character.features.join(', ') || 'Ninguno'}</div><div class="stat-box"><strong>Rasgos raciales:</strong> ${character.traits.join(', ') || 'Ninguno'}</div><div class="stat-box"><strong>Idiomas:</strong> ${character.languages.join(', ') || 'Ninguno'}</div><div class="stat-box"><strong>Ataques:</strong> ${character.attackFormulas.map((entry) => `${entry.name} (${entry.formula})`).join(', ') || 'Ninguno'}</div><div class="stat-box"><strong>Condiciones:</strong> ${character.conditions.join(', ') || 'Ninguna'}</div></div>
          </div>
        `;
      }

      function renderCampaignView() {
        const character = state.character;
        const campaign = state.campaign;
        if (!character || !campaign) return renderCreateView();
        return `
          <div class="app-shell">
            <header class="hero">
              <div class="panel">
                <p class="eyebrow">AI GM • campaña viva</p>
                <h1>${campaign.title}</h1>
                <p class="muted">${campaign.world}</p>
              </div>
              <div class="panel">
                <div class="stat-box"><strong>Personaje:</strong> ${character.name} (${character.race} ${character.className})</div>
                <div class="stat-box"><strong>Nivel:</strong> ${character.level}</div>
                <div class="stat-box"><strong>Ubicación:</strong> ${campaign.location}</div>
                <div class="stat-box"><strong>Última acción:</strong> ${campaign.lastAction}</div>
                <div class="row" style="margin-top:0.6rem;">
                  <button id="new-campaign" type="button">Nueva campaña</button>
                  <button class="secondary" id="dm-update" type="button">Actualizar por el DM</button>
                </div>
              </div>
            </header>
            <div class="two-col">
              <section class="panel grid">
                <h2>Resumen de campaña</h2>
                <p>${campaign.summary}</p>
                <p><strong>Estado:</strong> ${campaign.mood}</p>
                <h3>Lore persistente</h3>
                <ul>${campaign.lore.map((entry) => `<li>${entry}</li>`).join('')}</ul>
              </section>
              <section class="panel grid">
                <h2>Historia reciente</h2>
                <ul>${campaign.history.map((entry) => `<li>${entry}</li>`).join('')}</ul>
                <textarea id="action-input" placeholder="Escribe lo que hace tu personaje y pulsa Ctrl/Cmd + Enter">${state.actionInput}</textarea>
                <div class="row"><button id="advance-story" type="button">Avanzar la historia</button></div>
              </section>
            </div>
            <section class="panel grid">
              <h2>Hoja de personaje</h2>
              <p class="muted">La ficha es consultable en todo momento. Las estadísticas se bloquean tras la creación inicial. Los cambios de nivel o de situación pueden desbloquearlas con confirmación. Las competencias y habilidades se fijan tras confirmación y se vuelven inmutables.</p>
              <div class="row">
                <button id="unlock-stats" type="button" class="secondary">Desbloquear estadísticas</button>
                <button id="unlock-skills" type="button" class="secondary">Desbloquear competencias</button>
              </div>
              ${renderSheetContent(character, campaign)}
            </section>
          </div>
        `;
      }

      function render() {
        const container = document.getElementById('app');
        container.innerHTML = state.view === 'campaign' ? renderCampaignView() : renderCreateView();
        const actionInput = document.getElementById('action-input');
        if (actionInput) {
          actionInput.value = state.actionInput;
          actionInput.addEventListener('input', (event) => {
            state.actionInput = event.target.value;
          });
        }
      }

      bindEvents();
      loadState();
    </script>
  </body>
</html>
